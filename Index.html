<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Đăng ký tuyển sinh Trung tâm GDNN-GDTX Đăk Tô</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #f0f2f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .main-container {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      max-width: 800px;
      margin: 50px auto;
    }
    .header-logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .header-logo img {
      max-width: 120px;
      height: auto;
    }
    .header-title {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-weight: 600;
      font-size: 1.6rem;
    }
    .header-subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 40px;
      font-size: 1.1rem;
    }

    /* Input groups styling */
    .input-group {
      margin-bottom: 20px;
    }
    .input-group-text {
      background-color: transparent;
      border-right: none;
      color: #777;
      border-radius: 8px 0 0 8px;
      border-color: #ced4da;
    }
    .form-control, .form-select {
      border-left: none;
      border-radius: 0 8px 8px 0;
      border-color: #ced4da;
      padding-left: 0;
    }
    .form-control:focus, .form-select:focus {
      box-shadow: none;
      border-color: #ced4da;
    }

    /* Active border styling logic */
    .input-group:focus-within .input-group-text,
    .input-group:focus-within .form-control,
    .input-group:focus-within .form-select {
      border-color: #03a9f4;
    }

    .form-control::placeholder {
      color: #999;
    }

    /* Labels are hidden since we use placeholder and icons like in the design, except for file inputs where we want clear instructions */
    .section-title {
      color: #333;
      border-bottom: 2px solid #03a9f4;
      padding-bottom: 5px;
      margin-top: 40px;
      margin-bottom: 20px;
      font-size: 1.25rem;
      font-weight: 500;
    }

    /* File input custom styling to match overall rounded style */
    input[type=file] {
      border-left: 1px solid #ced4da;
      padding-left: 12px;
      border-radius: 0 8px 8px 0;
    }

    /* Submit button */
    .btn-submit {
      background-color: #03a9f4;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      width: 100%;
      color: white;
      transition: background-color 0.3s;
    }
    .btn-submit:hover {
      background-color: #0288d1;
      color: white;
    }

    #loadingSpinner {
      display: none;
    }

    .required-asterisk {
      color: red;
    }

    .checkbox-label {
      color: #555;
    }
  </style>
</head>

  <div class="header-title">
    TRUNG TÂM GDNN-GDTX ĐĂK TÔ
  </div>
  <div class="header-subtitle">
    Đơn xin đăng ký học lớp 10 hệ GDTX năm học 2026-2027
  </div>

  <form id="admissionForm">

    <!-- Tên -->
    <div class="input-group">
      <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
      <input type="text" class="form-control" id="fullName" name="fullName" required placeholder="Họ và Tên đầy đủ (viết chữ in HOA) *" oninput="this.value = this.value.toUpperCase()">
    </div>

    <!-- Ngày sinh & Giới tính -->
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="fa-regular fa-calendar-days"></i></span>
          <!-- using text with focus -> date to show placeholder properly -->
          <input type="text" onfocus="(this.type='date')" onblur="if(!this.value) this.type='text'" class="form-control" id="dob" name="dob" required placeholder="Sinh ngày *">
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-venus-mars"></i></span>
          <select class="form-select" id="gender" name="gender" required>
            <option value="" disabled selected hidden>Giới tính *</option>
            <option value="Nam">Nam</option>
            <option value="Nữ">Nữ</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Nơi sinh, Dân tộc, Tôn giáo -->
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
          <input type="text" class="form-control" id="placeOfBirth" name="placeOfBirth" required placeholder="Nơi sinh *">
        </div>
      </div>
      <div class="col-md-3">
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-users"></i></span>
          <input type="text" class="form-control" id="ethnicity" name="ethnicity" required placeholder="Dân tộc *">
        </div>
      </div>
      <div class="col-md-3">
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-hands-praying"></i></span>
          <input type="text" class="form-control" id="religion" name="religion" placeholder="Tôn giáo">
        </div>
      </div>
    </div>

    <!-- Địa chỉ -->
    <div class="input-group">
      <span class="input-group-text"><i class="fa-solid fa-house"></i></span>
      <input type="text" class="form-control" id="permanentAddress" name="permanentAddress" required placeholder="Hộ khẩu thường trú *">
    </div>
    <div class="input-group">
      <span class="input-group-text"><i class="fa-solid fa-map-pin"></i></span>
      <input type="text" class="form-control" id="currentAddress" name="currentAddress" required placeholder="Chỗ ở hiện tại (ghi chi tiết) *">
    </div>

    <!-- CCCD -->
    <div class="row">
      <div class="col-md-4">
        <div class="input-group">
          <span class="input-group-text"><i class="fa-regular fa-id-card"></i></span>
          <input type="text" class="form-control" id="cccdNumber" name="cccdNumber" required placeholder="Số Căn cước/CCCD *">
        </div>
      </div>
      <div class="col-md-4">
        <div class="input-group">
          <span class="input-group-text"><i class="fa-regular fa-calendar"></i></span>
          <input type="text" onfocus="(this.type='date')" onblur="if(!this.value) this.type='text'" class="form-control" id="cccdDate" name="cccdDate" required placeholder="Ngày cấp *">
        </div>
      </div>
      <div class="col-md-4">
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-building-columns"></i></span>
          <input type="text" class="form-control" id="cccdPlace" name="cccdPlace" required placeholder="Nơi cấp *">
        </div>
      </div>
    </div>

    <!-- Tốt nghiệp -->
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-graduation-cap"></i></span>
          <input type="text" class="form-control" id="graduationYear" name="graduationYear" required placeholder="Đã tốt nghiệp THCS năm *">
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-school"></i></span>
          <input type="text" class="form-control" id="schoolName" name="schoolName" required placeholder="Tại trường *">
        </div>
      </div>
    </div>

    <!-- Điện thoại & Lớp dự tuyển -->
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="fa-brands fa-whatsapp"></i></span>
          <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" required placeholder="Số điện thoại liên hệ *">
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-book"></i></span>
          <select class="form-select" id="classApplied" name="classApplied" required>
            <option value="" disabled selected hidden>Dự tuyển vào lớp *</option>
            <option value="10">Lớp 10</option>
            <option value="11">Lớp 11</option>
            <option value="12">Lớp 12</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section-title">Hồ sơ đính kèm <span style="font-size: 0.9rem; font-weight: normal; color: #777;">(jpg, png, pdf)</span></div>

    <!-- File Uploads -->
    <div class="row">
      <div class="col-md-6 mb-2">
        <label for="fileKhaiSinh" class="form-label mb-1 text-muted" style="font-size: 0.9rem;">Giấy khai sinh (công chứng) <span class="required-asterisk">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-regular fa-file-image"></i></span>
          <input class="form-control" type="file" id="fileKhaiSinh" required>
        </div>
      </div>
      <div class="col-md-6 mb-2">
        <label for="fileCCCD" class="form-label mb-1 text-muted" style="font-size: 0.9rem;">Bản sao CCCD (công chứng) <span class="required-asterisk">*</span></label>

<script>
  // Function to convert file input to Data URL
  function getBase64(file) {
    return new Promise((resolve, reject) => {
      if (!file) {
        resolve("");
        return;
      }
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  document.getElementById('admissionForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    // UI states
    const submitBtn = document.getElementById('submitBtn');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const resultMessage = document.getElementById('resultMessage');

    submitBtn.disabled = true;
    loadingSpinner.style.display = 'inline-block';
    resultMessage.innerHTML = '';

    try {
      // Gather files
      const fileKhaiSinh = document.getElementById('fileKhaiSinh').files[0];
      const fileCCCD = document.getElementById('fileCCCD').files[0];
      const fileBangTN = document.getElementById('fileBangTN').files[0];
      const fileHocBaTHCS = document.getElementById('fileHocBaTHCS').files[0];
      const fileAnh = document.getElementById('fileAnh').files[0];
      const fileHocBa1011 = document.getElementById('fileHocBa1011').files[0];
      const fileUuTien = document.getElementById('fileUuTien').files[0];
      const fileXNVPL = document.getElementById('fileXNVPL').files[0];

      // Convert to Base64
      const [
        fileKhaiSinhData, fileCCCDData, fileBangTNData, fileHocBaTHCSData,
        fileAnhData, fileHocBa1011Data, fileUuTienData, fileXNVPLData
      ] = await Promise.all([
        getBase64(fileKhaiSinh), getBase64(fileCCCD), getBase64(fileBangTN), getBase64(fileHocBaTHCS),
        getBase64(fileAnh), getBase64(fileHocBa1011), getBase64(fileUuTien), getBase64(fileXNVPL)
      ]);

      // Form Object
      const formData = {
        fullName: document.getElementById('fullName').value,
        dob: document.getElementById('dob').value,
        gender: document.getElementById('gender').value,
        placeOfBirth: document.getElementById('placeOfBirth').value,
        ethnicity: document.getElementById('ethnicity').value,
        religion: document.getElementById('religion').value,
        permanentAddress: document.getElementById('permanentAddress').value,
        currentAddress: document.getElementById('currentAddress').value,
        cccdNumber: document.getElementById('cccdNumber').value,
        cccdDate: document.getElementById('cccdDate').value,
        cccdPlace: document.getElementById('cccdPlace').value,
        graduationYear: document.getElementById('graduationYear').value,
        schoolName: document.getElementById('schoolName').value,
        phoneNumber: document.getElementById('phoneNumber').value,
        classApplied: document.getElementById('classApplied').value,
        fileKhaiSinhData: fileKhaiSinhData,
        fileCCCDData: fileCCCDData,
        fileBangTNData: fileBangTNData,
        fileHocBaTHCSData: fileHocBaTHCSData,
        fileAnhData: fileAnhData,
        fileHocBa1011Data: fileHocBa1011Data,
        fileUuTienData: fileUuTienData,
        fileXNVPLData: fileXNVPLData
      };

      // Call Google Apps Script function
      google.script.run
        .withSuccessHandler(function(response) {
          loadingSpinner.style.display = 'none';
          if (response.success) {
            resultMessage.style.color = 'green';
            resultMessage.innerHTML = response.message;
            document.getElementById('admissionForm').reset();
          } else {
            resultMessage.style.color = 'red';
            resultMessage.innerHTML = response.message;
            submitBtn.disabled = false;
          }
        })
        .withFailureHandler(function(error) {
          loadingSpinner.style.display = 'none';
          submitBtn.disabled = false;
          resultMessage.style.color = 'red';
          resultMessage.innerHTML = 'Lỗi hệ thống: ' + error.message;
        })
        .processForm(formData);

    } catch (err) {
      loadingSpinner.style.display = 'none';
      submitBtn.disabled = false;
      resultMessage.style.color = 'red';
      resultMessage.innerHTML = 'Lỗi khi xử lý file: ' + err.message;
    }
  });
</script>
