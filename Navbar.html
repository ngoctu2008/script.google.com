  <div class="container-fluid justify-content-center">
    <ul class="navbar-nav flex-row flex-wrap justify-content-center gap-3 w-100">
      <li class="nav-item">

      </li>
      <li class="nav-item">

      </li>
      <li class="nav-item">
        <a class="nav-link px-3 py-2" id="nav-plan" href="javascript:void(0);" onclick="showPage('plan')"><i class="fa-regular fa-calendar-check me-1"></i> Kế hoạch</a>
      </li>
      <li class="nav-item">

<style>
  .navbar-nav .nav-link {
    color: #555;
    font-weight: 500;
    border-radius: 8px;
    transition: all 0.2s ease;
  }
  .navbar-nav .nav-link:hover {
    background-color: #e9ecef;
    color: #03a9f4;
  }
  .navbar-nav .nav-link.active {
    font-weight: bold;
    color: #03a9f4 !important;
    background-color: #e1f5fe;
  }
</style>

<script>
  function showPage(pageId) {
    const pages = document.querySelectorAll('.page-content');
    pages.forEach(page => {
      page.style.display = 'none';
      page.classList.remove('fade-in');
    });

    const links = document.querySelectorAll('.nav-link');
    links.forEach(link => link.classList.remove('active'));

    const targetPage = document.getElementById('page-' + pageId);
    targetPage.style.display = 'block';

    // Slight delay to trigger animation
    setTimeout(() => {
        targetPage.classList.add('fade-in');
    }, 10);

    document.getElementById('nav-' + pageId).classList.add('active');
  }
</script>
